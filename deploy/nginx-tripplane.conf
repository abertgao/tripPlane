# tripPlane 公网入口与 GitHub hook
# 页面：http://62.234.178.115:8802/
# 钩子：http://62.234.178.115:8802/hooks/github
# 页面进程只监听 127.0.0.1:8812，钩子只监听 127.0.0.1:8810

upstream tripplane_app {
    server 127.0.0.1:8812 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

upstream tripplane_hook {
    server 127.0.0.1:8810;
}

server {
    listen 8802;
    listen [::]:8802;
    server_name _;

    client_max_body_size 10m;

    location = /hooks/github {
        proxy_pass http://tripplane_hook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://tripplane_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# tripPlane 测试站
# 公网：http://tripplane.62.234.178.115.sslip.io/
# 本机：http://127.0.0.1:8802/
# 只匹配独立 Host，不占用裸 IP 和 cfo / askread

upstream tripplane_app {
    server 127.0.0.1:8802 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name tripplane.62.234.178.115.sslip.io;

    client_max_body_size 10m;

    location / {
        proxy_pass http://tripplane_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

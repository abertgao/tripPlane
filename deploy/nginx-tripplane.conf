# tripPlane 公网入口与 GitHub hook
# 页面：http://62.234.178.115:8802/
# 钩子：http://62.234.178.115:8802/hooks/github
# 页面进程只监听 127.0.0.1:8812，钩子只监听 127.0.0.1:8810

upstream tripplane_app {
    server 127.0.0.1:8812 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

upstream tripplane_hook {
    server 127.0.0.1:8810;
}

server {
    listen 8802;
    listen [::]:8802;
    server_name _;

    client_max_body_size 10m;

    location = /hooks/github {
        proxy_pass http://tripplane_hook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
    }

    root /var/www/shanhe/current;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    location /api/ { return 403; }
    location = /migration { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location = /manifest.webmanifest { return 404; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 403; }
        return 302 https://62.234.178.115$request_uri;
    }
}

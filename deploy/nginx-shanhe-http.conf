server {
    listen 80;
    listen [::]:80;
    server_name 62.234.178.115;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shanhe-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location /api/ { return 403; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 403; }
        return 302 https://62.234.178.115$request_uri;
    }
}
